# Control de Desviaciones — configuración de ejemplo para Nginx.
#
# Publica la aplicación como subdirectorio de un sitio existente, en
# https://TU-DOMINIO/control-desviaciones/, y opcionalmente proxea la API de BIT
# para resolver CORS.
#
# Ajustar: server_name, root y las rutas de los certificados.

server {
    listen 443 ssl;
    http2 on;
    server_name logity.com;

    ssl_certificate     /etc/letsencrypt/live/logity.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/logity.com/privkey.pem;

    root /var/www/logity;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # ------------------------------------------------------------------
    # La aplicación
    # ------------------------------------------------------------------
    location /control-desviaciones/ {
        # Sin login propio: si el contenido no debe ser público, descomentar.
        # auth_basic           "Control de Desviaciones";
        # auth_basic_user_file /etc/nginx/.htpasswd-desviaciones;

        try_files $uri $uri/ /control-desviaciones/index.html;
    }

    # Los nombres de los assets son estables (app.js, app.css) y cambian de
    # contenido en cada publicación: se revalidan siempre para que una
    # actualización se vea al instante.
    location ~* ^/control-desviaciones/.*\.(?:html|css|js)$ {
        add_header Cache-Control "no-cache";
    }

    # ------------------------------------------------------------------
    # Proxy hacia la API de BIT (opcional)
    # ------------------------------------------------------------------
    # Deja la petición en el mismo origen, así desaparece el problema de CORS.
    # En la aplicación se configura el campo "Proxy" apuntando a:
    #   https://logity.com/api/bit/misservicios/reporte/prod-general
    #
    # Nota: esto NO oculta la apiKey, porque viaja en el cuerpo que manda el
    # navegador. Para que la clave no salga del servidor hace falta un webhook
    # intermedio que la inyecte — ver DESPLIEGUE.md.
    location /api/bit/ {
        proxy_pass https://biterp.cl:451/api/;
        proxy_set_header Host biterp.cl;
        proxy_ssl_server_name on;
        proxy_read_timeout 60s;
    }
}
